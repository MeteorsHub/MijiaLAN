name: Matter bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MatterBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MatterBridge/package-lock.json
      - run: python3 ../scripts/app_icon.py --check
      - run: npm ci
      - run: npm test
  swift:
    runs-on: macos-15
    # The image defaults to Xcode 16.4, whose Swift 6.1.2 crashes in SwiftUI actor-binding IRGen.
    # Pin an installed toolchain; keep the deployment target at macOS 15.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected Xcode and Swift
        run: |
          xcodebuild -version
          swift --version
      - run: swift build --product mijia-lan --force-resolved-versions
      - run: swift build --product MijiaLANApp --force-resolved-versions
      - name: Verify vendored MijiaCore behavior
        run: swift test --package-path Vendor/MenuBarMijia --scratch-path .build/mijiacore-tests --filter 'MiCloudTests|MiCloudPollingTests|ModelActionPolicyTests|SnapshotObservationTests|LocalizationTests'
      - name: Run core and transport regression suites
        shell: bash
        run: |
          mkdir -p build/ci-logs
          swift test --force-resolved-versions --filter 'MijiaLANTests|MijiaHomeKitBridgeTests|MijiaMatterRPCTests|MatterPlatformTests|MatterSnapshotPollingTests|CurtainControlPreferenceTests|CurtainInteractionTests|CurtainManualFailurePresentationTests|CurtainPositionDraftTests|NumberDraftPollingTests|HomeKitServiceSelectionTests|CachedHomeKitDiagnosticTests|PanelMemoryTests|PanelToggleTests' 2>&1 | tee build/ci-logs/swift-tests.log
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-logs
          path: build/ci-logs/
          if-no-files-found: ignore
