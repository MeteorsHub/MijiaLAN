name: Matter bridge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MatterBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MatterBridge/package-lock.json
      - run: npm ci
      - run: npm test
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --product mijia-lan --force-resolved-versions
      - run: swift build --product MijiaLANApp --force-resolved-versions
      - run: swift test --force-resolved-versions --filter "MatterRPCTests|MatterDevicePlanTests|MatterPlatformTests"
